<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Strength Analyzer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      color: #111827;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #374151;
    }

    .password-box {
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 14px;
      border: 2px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    #toggleBtn {
      background: #e5e7eb;
      color: #111827;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #f3f4f6;
    }

    .strength {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .weak {
      color: #dc2626;
    }

    .medium {
      color: #d97706;
    }

    .strong {
      color: #16a34a;
    }

    ul {
      list-style: none;
      margin-top: 15px;
    }

    li {
      margin: 8px 0;
      color: #374151;
    }

    .suggestion {
      margin-top: 20px;
      padding: 15px;
      background: #eff6ff;
      border-left: 4px solid #2563eb;
      border-radius: 8px;
    }

    .suggestion strong {
      color: #1d4ed8;
    }

    .meter {
      height: 10px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    #meterFill {
      height: 100%;
      width: 0%;
      transition: 0.3s;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #6b7280;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔐 Password Strength Analyzer</h1>

    <p class="subtitle">
      Check your password strength and get better suggestions.
    </p>

    <label for="password">Enter Password</label>

    <div class="password-box">
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        oninput="analyzePassword()"
      >

      <button id="toggleBtn" onclick="togglePassword()">
        Show
      </button>
    </div>

    <div class="result">

      <div id="strengthText" class="strength">
        Enter a password
      </div>

      <div class="meter">
        <div id="meterFill"></div>
